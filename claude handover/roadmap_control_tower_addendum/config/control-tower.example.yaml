controlTower:
  basePath: /programme
  access: private
  updateMode: repository-and-ci-events
  freshness:
    commitMinutes: 5
    ciMinutes: 10
    documentsHours: 24
  rag:
    citationsRequired: true
    denyUnsupportedAnswers: true
    indexScopes: [canonical-documents, decisions, slice-manifests, build-ledger, evidence-index, open-items]
  approvals:
    cursorMayApprove: false
    claudeMayApprove: false
    requireNamedAuthority: true

