# Control Tower live target: Railway project `atelier-doclar` only.
# MD-LV1 deploys this service. Event OS is not authorised from this file.
[build]
builder = "nixpacks"
buildCommand = "pnpm install --frozen-lockfile --config.production=false && pnpm --filter @maison-doclar/control-tower build"

[deploy]
startCommand = "pnpm --filter @maison-doclar/control-tower start"
healthcheckPath = "/api/health/live"
restartPolicyType = "ON_FAILURE"
