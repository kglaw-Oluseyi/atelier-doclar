name: sign-solver-worker

# M6A supply-chain proof: keyless-sign an already-published GHCR digest.
# Must never build, rebuild, retag latest, or use interactive Cosign auth.

on:
  workflow_dispatch:
    inputs:
      image:
        description: GHCR repository (no digest)
        required: true
        default: ghcr.io/kglaw-oluseyi/atelier-doclar-solver-worker
      digest:
        description: Authoritative registry manifest digest (sha256:...)
        required: true
        default: sha256:a41f51937a653ed4653bbc687addb3a8f2603799accfec8c0dac0f09aef86e92
      expected_revision:
        description: Exact org.opencontainers.image.revision label
        required: true
        default: bbec476f0ca9959d7145853fc45461d10879fc01

# packages:write is required for Cosign to attach signature OCI artifacts to GHCR.
# contents:read + id-token:write enable OIDC keyless signing without secrets.
permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify digest exists and revision label
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ inputs.digest }}
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
        run: |
          set -euo pipefail
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "digest must start with sha256:"; exit 1 ;;
          esac
          REF="${IMAGE}@${DIGEST}"
          echo "Verifying ${REF}"
          if ! crane manifest "$REF" >/tmp/manifest.json; then
            echo "DIGEST_NOT_FOUND: ${REF}"
            exit 1
          fi
          python3 - <<'PY'
          import json, os, subprocess, sys
          image = os.environ["IMAGE"]
          expected = os.environ["EXPECTED_REVISION"]
          digest = os.environ["DIGEST"]
          manifest = json.load(open("/tmp/manifest.json"))
          mt = manifest.get("mediaType", "")
          if "index" in mt or "manifest.list" in mt:
              amd = None
              for m in manifest.get("manifests") or []:
                  p = m.get("platform") or {}
                  if p.get("os") == "linux" and p.get("architecture") == "amd64":
                      amd = m
                      break
              if not amd:
                  print("no linux/amd64 platform in index", file=sys.stderr)
                  sys.exit(1)
              config_ref = f"{image}@{amd['digest']}"
              print(f"index={digest} linux/amd64_child={amd['digest']}")
          else:
              config_ref = f"{image}@{digest}"
          cfg = json.loads(subprocess.check_output(["crane", "config", config_ref], text=True))
          labels = (cfg.get("config") or {}).get("Labels") or {}
          rev = labels.get("org.opencontainers.image.revision")
          print(f"os/arch={cfg.get('os')}/{cfg.get('architecture')}")
          print(f"revision={rev}")
          if rev != expected:
              print(f"revision mismatch: got {rev!r} expected {expected!r}", file=sys.stderr)
              sys.exit(1)
          if cfg.get("os") != "linux" or cfg.get("architecture") != "amd64":
              print(f"platform mismatch: {cfg.get('os')}/{cfg.get('architecture')}", file=sys.stderr)
              sys.exit(1)
          print("DIGEST_IDENTITY_OK")
          PY

      - name: Sign digest (Sigstore keyless OIDC)
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          REF="${IMAGE}@${DIGEST}"
          cosign sign --yes "$REF"

      - name: Verify signature
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          REF="${IMAGE}@${DIGEST}"
          IDENTITY_REGEXP="https://github.com/${{ github.repository }}/.github/workflows/sign-solver-worker.yml@.*"
          ISSUER="https://token.actions.githubusercontent.com"
          cosign verify \
            --certificate-identity-regexp "${IDENTITY_REGEXP}" \
            --certificate-oidc-issuer "${ISSUER}" \
            "$REF" | tee cosign-verify.json
          cosign tree "$REF" | tee cosign-tree.txt
          echo "expected_identity_regexp=${IDENTITY_REGEXP}" | tee cosign-identity.txt
          echo "expected_issuer=${ISSUER}" | tee -a cosign-identity.txt
          echo "SIGNATURE_VERIFIED"

      - name: Upload signature evidence
        uses: actions/upload-artifact@v4
        with:
          name: m6a-signature-evidence
          path: |
            cosign-verify.json
            cosign-tree.txt
            cosign-identity.txt
          if-no-files-found: error
