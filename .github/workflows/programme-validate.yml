name: programme-validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Validate programme corpus
        run: pnpm programme:validate

      - name: Project programme events and status
        run: pnpm programme:project

      - name: Verify ingestion boundary
        run: pnpm programme:ingest:verify

      - name: Reconcile synthetic repository evidence
        run: pnpm programme:reconcile

      - name: Production build
        run: pnpm --filter @maison-doclar/control-tower build

      - name: Install Playwright Chromium
        run: pnpm --filter @maison-doclar/control-tower exec playwright install --with-deps chromium

      - name: Control Tower browser tests
        run: pnpm e2e
        env:
          PROGRAMME_ALLOW_FIXTURES: "1"
          CI: "1"
          PROGRAMME_ACCESS_TOKEN: ci-control-tower-access-token
          PROGRAMME_SESSION_SECRET: ci-control-tower-session-secret-32b
