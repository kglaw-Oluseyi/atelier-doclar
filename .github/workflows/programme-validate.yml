name: programme-validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: event_os_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d event_os_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Validate programme corpus
        run: pnpm programme:validate

      - name: Project programme events and status
        run: pnpm programme:project

      - name: Verify ingestion boundary
        run: pnpm programme:ingest:verify

      - name: Reconcile synthetic repository evidence
        run: pnpm programme:reconcile

      - name: Production build
        run: pnpm --filter @maison-doclar/control-tower build && pnpm --filter @maison-doclar/event-os build

      - name: Install Playwright Chromium
        run: pnpm --filter @maison-doclar/control-tower exec playwright install --with-deps chromium && pnpm --filter @maison-doclar/event-os exec playwright install chromium

      - name: Control Tower browser tests
        run: pnpm e2e
        env:
          PROGRAMME_ALLOW_FIXTURES: "1"
          CI: "1"
          PROGRAMME_ACCESS_TOKEN: ci-control-tower-access-token
          PROGRAMME_SESSION_SECRET: ci-control-tower-session-secret-32b

      - name: Bootstrap ephemeral CI Postgres (migrate + synthetic seed)
        run: pnpm --filter @maison-doclar/event-os exec tsx ./scripts/ci-postgres-reset.ts
        env:
          EVENT_OS_CI_POSTGRES: "1"
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/event_os_ci
          EVENT_OS_ALLOW_FIXTURES: "1"

      # Formal Event OS browser corpus: production build + next start + ephemeral Postgres.
      # Never next-dev. Each shard resets the ephemeral database and starts a fresh next start.
      - name: Event OS browser tests (sharded Postgres + next start)
        run: pnpm --filter @maison-doclar/event-os e2e:ci
        timeout-minutes: 240
        env:
          EVENT_OS_CI_POSTGRES: "1"
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/event_os_ci
          EVENT_OS_ALLOW_FIXTURES: "1"
          CI: "1"
          EVENT_OS_E2E_HEAP_MB: "2048"
          EVENT_OS_ACCESS_TOKEN: ci-event-os-access-token
          EVENT_OS_SESSION_SECRET: ci-event-os-session-secret-32b
          EVENT_OS_RSVP_PEPPER: ci-event-os-rsvp-pepper-32bytes
          EVENT_OS_RSVP_SESSION_SECRET: ci-event-os-rsvp-session-secret-32

      - name: Upload Event OS Playwright shard artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: event-os-playwright-shards
          path: |
            apps/event-os/ci-e2e-shard-logs/
            apps/event-os/test-results/
            apps/event-os/playwright-report/
          if-no-files-found: warn
          retention-days: 14
