name: eos-s01
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: eos_s01_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eos_s01_test
      EVENT_OS_SESSION_SECRET: ci-session-secret-value-at-least-32
      EVENT_OS_ALLOW_FIXTURES: "1"
      EVENT_OS_GIT_SHA: ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @maison-doclar/foundation typecheck
      - run: pnpm --filter @maison-doclar/foundation test
      - run: pnpm --filter @maison-doclar/event-os test
      - run: pnpm --filter @maison-doclar/event-os build
      - run: node scripts/secret-scan.mjs
      - run: node scripts/static-gates.mjs
