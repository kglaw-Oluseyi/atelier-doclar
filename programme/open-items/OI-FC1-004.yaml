notes: "RESOLUTION EOS-S01: RESOLVED_BY_EVENT_OS_ARCHITECTURE. Authoritative shared concepts live in @maison-doclar/shared-platform. Event OS consumes those contracts. Persistence is an explicit PlatformStore port with memory (NON_PRODUCTION) and PostgreSQL adapters. Production migration and Railway mutation are not authorised. Tests prove organisation/event isolation, identity invariants, concurrency, idempotency and append-only audit. See docs/control/EVENT_OS_SHARED_PLATFORM_BOUNDARY.md."
