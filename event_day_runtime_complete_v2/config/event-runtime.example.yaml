runtime:
  mode: edge
  eventId: EVENT_ID_REQUIRED
  organisationId: ORGANISATION_ID_REQUIRED
  packageRevision: PACKAGE_REVISION_REQUIRED
  capabilities:
    initialCheckIn: true
    qrScan: true
    manualLookup: true
    departmentalOperations: true
    faceGateReturnRecognition: false
  localAuthority:
    singleWriter: true
    clientEmergencyOutbox: bounded
  faceGate:
    mayCreateInitialAttendance: false
    mayAdmitAutonomously: false
    assertionTtlSeconds: 30
  reconciliation:
    lastWriteWins: false
    requireSealAndDualControl: true

